services:
  mysql:
    image: public.ecr.aws/docker/library/mysql:8.4
    environment:
      MYSQL_DATABASE: llm_eval_hub
      MYSQL_USER: llm_eval_hub
      MYSQL_PASSWORD: ${HUB_DB_PASSWORD:?Set HUB_DB_PASSWORD before starting Compose}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - hub_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: .
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: "jdbc:mysql://mysql:3306/llm_eval_hub?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
      DB_USER: llm_eval_hub
      DB_PASSWORD: ${HUB_DB_PASSWORD:?Set HUB_DB_PASSWORD before starting Compose}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HUB_API_PORT:-18080}:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${HUB_WEB_PORT:-5173}:80"

volumes:
  hub_mysql_data:
