name: CI

on:
  push:
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Backend tests and package
        run: mvn -B verify
      - name: Frontend typecheck and build
        run: |
          npm install --global pnpm@11.25.0
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build
      - name: Create disposable database password
        run: echo "HUB_DB_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Start isolated stack
        run: docker compose up -d --build
      - name: Import and compare reports
        run: |
          python3 scripts/smoke.py seed
          node scripts/check-page.mjs
      - name: Restart stack without deleting volume
        run: |
          docker compose down
          docker compose up -d
      - name: Verify persisted results and page
        run: |
          python3 scripts/smoke.py verify
          node scripts/check-page.mjs
      - name: Remove isolated stack and volume
        if: always()
        run: docker compose down -v --remove-orphans
