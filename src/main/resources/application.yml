server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/llm_eval_hub?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:llm_eval_hub}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  jackson:
    time-zone: UTC
